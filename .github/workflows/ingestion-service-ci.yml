name: EKA Ingestion Service CI

on:
  push:
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/ingestion-service-ci.yml"
  pull_request:
    paths:
      - "services/ingestion-service/**"
      - ".github/workflows/ingestion-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://eka_test:eka_test@localhost:5432/eka_test
      DOCUMENT_STORAGE_PATH: ./test-storage
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 200
      PROCESSING_VERSION: 1.0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eka_test
          POSTGRES_PASSWORD: eka_test
          POSTGRES_DB: eka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eka_test -d eka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/ingestion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -v
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: docker build -t eka-ingestion-service:ci .
