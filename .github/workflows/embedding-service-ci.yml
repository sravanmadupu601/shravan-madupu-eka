name: EKA Embedding Service CI

on:
  push:
    paths:
      - "services/embedding-service/**"
      - "libraries/eka-ai/**"
      - ".github/workflows/embedding-service-ci.yml"
  pull_request:
    paths:
      - "services/embedding-service/**"
      - "libraries/eka-ai/**"
      - ".github/workflows/embedding-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://eka_test:eka_test@localhost:5432/eka_test
      EMBEDDING_MODEL_NAME: test-model
      EMBEDDING_MODEL_VERSION: test-v1
      EMBEDDING_DIMENSION: 3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eka_test
          POSTGRES_PASSWORD: eka_test
          POSTGRES_DB: eka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eka_test -d eka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/embedding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/embedding-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -v
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: docker build -f services/embedding-service/Dockerfile -t eka-embedding-service:ci .