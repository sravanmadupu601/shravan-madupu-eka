name: EKA Document Service CI

on:
  push:
    paths:
      - "services/document-service/**"
      - ".github/workflows/document-service-ci.yml"

  pull_request:
    paths:
      - "services/document-service/**"
      - ".github/workflows/document-service-ci.yml"

jobs:
  test:
    name: Test Document Service

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://eka_test:eka_test@localhost:5432/eka_test
      STORAGE_PATH: ./test-storage
      MAX_FILE_SIZE_MB: 10

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: eka_test
          POSTGRES_PASSWORD: eka_test
          POSTGRES_DB: eka_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U eka_test -d eka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/document-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/document-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest -v