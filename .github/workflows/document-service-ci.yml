name: EKA Document Service CI

on:
  push:
    paths:
      - "services/document-service/**"
      - ".github/workflows/document-service-ci.yml"

  pull_request:
    paths:
      - "services/document-service/**"
      - ".github/workflows/document-service-ci.yml"

jobs:
  test:
    name: Test Document Service

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/document-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/document-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v